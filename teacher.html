<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>檢討點題・老師</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
  <header>
    <h1>檢討點題・老師</h1>
    <p class="sub">設定這次考卷，看同學想問哪幾題。</p>
  </header>

  <section id="gate" class="card gate" hidden>
    <div class="card-head">
      <h2>老師登入</h2>
      <p class="meta">輸入密碼後才能設定考卷。這支手機會記住密碼。</p>
    </div>
    <form id="gate-form">
      <div class="field">
        <label for="pw">老師密碼</label>
        <input id="pw" type="password" autocomplete="current-password">
      </div>
      <p class="err" id="gate-err" role="alert"></p>
      <button class="primary" id="gate-btn" type="submit">登入</button>
    </form>
  </section>

  <section id="main" class="panel" style="margin-top:16px" hidden>
    <details class="setup" id="setup" open>
      <summary><span>這次考卷</span><span class="meta" id="setup-sum"></span></summary>
      <div class="setup-body">
        <div class="nl">
          <label for="nl-input">用講的或打字，說出這次的題型和題號</label>
          <textarea id="nl-input" rows="3" placeholder="例：選擇 1 到 20，題組 21 到 23，素養 A 到 E"></textarea>
          <p class="meta" id="nl-preview" aria-live="polite">按鍵盤上的麥克風就能語音輸入。</p>
          <button class="primary" id="nl-apply" type="button">建立這次的題目</button>
        </div>
        <details class="manual">
          <summary>手動調整題型和題號</summary>
          <div class="manual-body">
            <p class="meta">題號可以跳著寫，例如 1-10, 13, 15-18。素養題可以寫 A-E。</p>
            <div id="setup-rows"></div>
            <div class="chips" role="group" aria-label="快速新增題型">
              <span class="meta">新增題型</span>
              <button class="chip" type="button" data-name="選擇題">選擇題</button>
              <button class="chip" type="button" data-name="填充題">填充題</button>
              <button class="chip" type="button" data-name="進階題">進階題</button>
              <button class="chip" type="button" data-name="素養題">素養題</button>
              <button class="chip" type="button" data-name="題組">題組</button>
              <button class="chip" type="button" data-name="">自訂</button>
            </div>
            <div class="setup-actions">
              <button class="ghost" id="apply-setup" type="button">套用手動調整</button>
            </div>
          </div>
        </details>
        <p class="meta" id="setup-msg" aria-live="polite"></p>
      </div>
    </details>

    <div class="card summary">
      <div>
        <div class="big"><span id="n-resp">0</span><span class="unit">人已回覆</span></div>
        <p class="meta" id="n-detail"></p>
      </div>
    </div>

    <div class="toolbar">
      <div class="seg" role="group" aria-label="排序方式">
        <button type="button" id="sort-count" aria-pressed="true">人數多到少</button>
        <button type="button" id="sort-num" aria-pressed="false">依題號</button>
      </div>
      <p class="meta">點一題可標記為已講解</p>
    </div>

    <div class="card">
      <ol class="rank" id="rank"></ol>
      <p class="zero" id="zero-line" hidden></p>
    </div>

    <p class="net" id="net" aria-live="polite"></p>

    <div class="end-session" id="end-wrap">
      <button class="ghost" id="end-btn" type="button">結束這次檢討</button>
      <p class="meta">會清掉這次的題目和所有回覆，下一堂課重新輸入。</p>
    </div>
  </section>
</div>

<script src="/teacher.js"></script>
</body>
</html>
