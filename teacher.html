<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>檢討點題・老師</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
  <header>
    <h1>檢討點題・老師</h1>
    <p class="sub">設定這次考卷，看同學想問哪幾題。</p>
  </header>

  <section id="gate" class="card gate" hidden>
    <div class="card-head">
      <h2>老師登入</h2>
      <p class="meta">輸入密碼後才能設定考卷。這支手機會記住密碼。</p>
    </div>
    <form id="gate-form">
      <div class="field">
        <label for="pw">老師密碼</label>
        <input id="pw" type="password" autocomplete="current-password">
      </div>
      <p class="err" id="gate-err" role="alert"></p>
      <button class="primary" id="gate-btn" type="submit">登入</button>
    </form>
  </section>

  <section id="main" class="panel" style="margin-top:16px" hidden>
    <details class="setup" id="setup" open>
      <summary><span>這次考卷</span><span class="meta" id="setup-sum"></span></summary>
      <div class="setup-body">
        <div class="nl">
          <label for="nl-input">快速填表：用講的或打字，說出題型和題號</label>
          <div class="fmt" role="note" aria-label="念法提示">
            <p class="fmt-t">照這兩種句型念，最準</p>
            <p class="fmt-l"><b>①</b> 題型，x~x題。<span class="ex">例：單選題，1~20題。</span></p>
            <p class="fmt-l"><b>②</b> 題型的第x題有x個小題。<span class="ex">例：填充題的第1題有3個小題。</span></p>
          </div>
          <textarea id="nl-input" rows="3" placeholder="例：單選題，1~20題。填充題，1~2題。填充題的第1題有3個小題。"></textarea>
          <p class="meta" id="nl-help">用手機鍵盤上的麥克風就能語音輸入。念完按「填入卡片」。</p>
          <div class="nl-tools">
            <button class="ghost mic" id="mic" type="button" aria-pressed="false" hidden>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v4"></path></svg><span id="mic-label">念一句</span>
            </button>
            <button class="ghost" id="nl-example" type="button">帶入範例</button>
          </div>
          <button class="primary" id="nl-fill" type="button">填入卡片</button>
          <p class="meta" id="nl-msg" aria-live="polite"></p>
        </div>

        <div class="cards-wrap">
          <h3 id="cards-title">題型卡片（可直接修改）</h3>
          <p class="meta" id="cards-empty">還沒有卡片。上面念一念再按「填入卡片」，或按下面「＋加一種題型」自己填。</p>
          <div class="cards" id="cards"></div>
          <button class="ghost" id="add-card" type="button">＋加一種題型</button>
          <p class="meta" id="cards-sum" aria-live="polite"></p>
        </div>

        <button class="primary block" id="build" type="button">建立這次的題目</button>
        <p class="meta" id="setup-msg" aria-live="polite"></p>
      </div>
    </details>

    <div class="card summary">
      <div>
        <div class="big"><span id="n-resp">0</span><span class="unit">人已回覆</span></div>
        <p class="meta" id="n-detail"></p>
      </div>
    </div>

    <div class="toolbar">
      <div class="seg" role="group" aria-label="排序方式">
        <button type="button" id="sort-count" aria-pressed="true">人數多到少</button>
        <button type="button" id="sort-num" aria-pressed="false">依題號</button>
      </div>
      <p class="meta">點一題可標記為已講解</p>
    </div>

    <div class="card">
      <ol class="rank" id="rank"></ol>
      <p class="zero" id="zero-line" hidden></p>
    </div>

    <p class="net" id="net" aria-live="polite"></p>

    <div class="end-session" id="end-wrap">
      <button class="ghost" id="end-btn" type="button">結束這次檢討</button>
      <p class="meta">會清掉這次的題目和所有回覆，下一堂課重新輸入。</p>
    </div>
  </section>
</div>

<script src="/teacher.js"></script>
</body>
</html>
